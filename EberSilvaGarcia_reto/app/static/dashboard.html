<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR Assistant · Tablero</title>
<style nonce="{{nonce}}">
  :root { --bg: #f6f7f9; --card: #fff; --ink: #1d2433; --muted: #5d6779; --line: #dfe3ea;
          --accent: #1f6feb; --bad: #b42318; --ok: #067647; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1419; --card: #171d24; --ink: #e6e9ee; --muted: #9aa4b2;
            --line: #2a323d; --accent: #4c8dff; --bad: #f97066; --ok: #47cd89; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg);
         color: var(--ink); }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 24px 0 8px; color: var(--muted); }
  p.sub { color: var(--muted); margin: 0 0 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
          gap: 12px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 12px 14px; }
  .tile .label { font-size: 12px; color: var(--muted); }
  .tile .value { font-size: 22px; font-variant-numeric: tabular-nums; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  table { width: 100%; border-collapse: collapse; background: var(--card);
          border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  td, th { text-align: left; padding: 6px 10px; border-top: 1px solid var(--line);
           font-size: 13px; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  input { padding: 8px; border: 1px solid var(--line); border-radius: 8px;
          background: var(--card); color: var(--ink); width: 280px; max-width: 100%; }
  a { color: var(--accent); }
  #status { font-size: 13px; color: var(--muted); margin-left: 8px; }
</style>
</head>
<body>
<main>
  <h1>Tablero de operación</h1>
  <p class="sub">Métricas en vivo de este proceso (se actualizan cada 5 s).
    <a href="/">Volver al asistente</a> · <a href="/metrics/prometheus">Prometheus</a></p>
  <label for="key">Clave con permiso de métricas</label><br>
  <input id="key" type="password" autocomplete="off"><span id="status"></span>

  <h2>Técnicas</h2>
  <div class="grid" id="tech"></div>
  <h2>Costos</h2>
  <div class="grid" id="cost"></div>
  <h2>Negocio y seguridad</h2>
  <table><tbody id="counters"></tbody></table>
</main>
<script nonce="{{nonce}}">
(function () {
  "use strict";
  var key = document.getElementById("key");
  var status = document.getElementById("status");
  try { key.value = sessionStorage.getItem("hr-api-key") || ""; } catch (e) {}
  key.addEventListener("change", function () {
    try { sessionStorage.setItem("hr-api-key", key.value); } catch (e) {}
    load();
  });

  function tile(parent, label, value, cls) {
    var box = document.createElement("div");
    box.className = "tile";
    var l = document.createElement("div");
    l.className = "label";
    l.textContent = label;
    var v = document.createElement("div");
    v.className = "value" + (cls ? " " + cls : "");
    v.textContent = value;
    box.appendChild(l);
    box.appendChild(v);
    parent.appendChild(box);
  }

  async function load() {
    if (!key.value) { status.textContent = "Escribe la clave."; return; }
    var response = await fetch("/metrics", { headers: { "X-API-Key": key.value } });
    if (!response.ok) { status.textContent = "Error " + response.status; return; }
    var m = await response.json();
    status.textContent = "pid " + m.pid + " · actualizado";
    var tech = document.getElementById("tech");
    var cost = document.getElementById("cost");
    var counters = document.getElementById("counters");
    tech.textContent = ""; cost.textContent = ""; counters.textContent = "";
    tile(tech, "Peticiones", m.requests);
    tile(tech, "Tasa de error", (m.error_rate * 100).toFixed(2) + " %",
         m.error_rate > 0.01 ? "bad" : "ok");
    tile(tech, "Latencia p50 (ms)", m.latency_ms.p50);
    tile(tech, "Latencia p95 (ms)", m.latency_ms.p95);
    tile(tech, "SLO p95 < " + m.slo.p95_ms_target + " ms", m.slo.met ? "Cumple" : "No cumple",
         m.slo.met ? "ok" : "bad");
    tile(tech, "Agente p95 (ms)", m.agent_latency_ms.p95);
    tile(cost, "Costo acumulado (USD)", "$" + Number(m.cost_usd).toFixed(6));
    tile(cost, "Tokens entrada", m.tokens.input);
    tile(cost, "Tokens salida", m.tokens.output);
    tile(cost, "Llamadas al modelo", m.model_calls);
    tile(cost, "Llamadas en caché", m.cached_calls);
    tile(cost, "Respuestas en caché", m.answer_cache_hits);
    Object.keys(m.counters).forEach(function (name) {
      var tr = document.createElement("tr");
      var a = document.createElement("td");
      a.textContent = name;
      var b = document.createElement("td");
      b.className = "n";
      b.textContent = m.counters[name];
      tr.appendChild(a); tr.appendChild(b);
      counters.appendChild(tr);
    });
  }
  load();
  setInterval(load, 5000);
})();
</script>
</body>
</html>
