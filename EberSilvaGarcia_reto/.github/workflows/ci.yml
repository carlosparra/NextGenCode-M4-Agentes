# Pipeline de CI del reto. GitHub solo ejecuta flujos de la raíz del repositorio:
# para activarlo en tu fork copia este archivo a .github/workflows/ en la raíz
# (no va en el PR porque el reto pide tocar solo esta carpeta).
name: hr-assistant-ci

on:
  push:
    paths: ["EberSilvaGarcia_reto/**"]
  pull_request:
    paths: ["EberSilvaGarcia_reto/**"]

permissions:
  contents: read

defaults:
  run:
    working-directory: EberSilvaGarcia_reto

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - run: python -m black --check app tests scripts
      - run: python -m pylint app tests --fail-under=10

  unit:
    needs: style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q --cov=app --cov-fail-under=80
      - run: python scripts/evaluate.py --fake-only

  e2e:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt && python -m playwright install --with-deps chromium
      - run: python -m pytest -q e2e

  security:
    needs: style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Secretos en el código (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dependencias vulnerables (pip-audit)
        run: pip install pip-audit && pip-audit -r requirements.txt

  docker:
    needs: [unit, e2e, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hr-assistant:ci .
